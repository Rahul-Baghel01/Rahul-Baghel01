<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 232" width="500" height="232" role="img" aria-labelledby="focus-title focus-desc">
<title id="focus-title">Rahul Baghel's engineering focus</title>
<desc id="focus-desc">An animated dashboard summarizing Rahul's full-stack, AI API, database, Voice AI, and PrepWise development focus.</desc>
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes focusPulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(560px) skewX(-15deg)}}
.row{opacity:0;animation:fadeSlide .5s ease forwards}
.rk{animation:focusPulse 2.4s ease-in-out infinite}
.sh{animation:shineX 4.5s ease-in-out 2.4s infinite}
]]></style>
<style><![CDATA[
svg{background:#050816}[fill="#ff7eb6"],[fill="#e879f9"]{fill:#00d9ff!important}[stroke="#ff7eb6"]{stroke:#00d9ff!important}text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}[x="1"][y="1"]{fill:#0b1120!important;fill-opacity:.9;stroke:#00d9ff!important;stroke-opacity:.22;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}.rk{filter:drop-shadow(0 0 4px rgba(0,217,255,.5))}text[fill="#c9d1d9"]{fill:#cbd5e1!important}text[fill="#8b949e"]{fill:#94a3b8!important}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#00d9ff;#8b5cf6;#00d9ff" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#00d9ff;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#00d9ff"/><stop offset="100%" stop-color="#8b5cf6"/>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="498" height="230" rx="14"/></clipPath>
<filter id="g"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="498" height="230" rx="14" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
<text x="24" y="38" font-size="16" font-weight="bold" fill="url(#tg)">Rahul's Engineering Focus</text>

  <g class="row" style="animation-delay:0.50s">
    <text x="24" y="74" font-size="14">&lt;/&gt;</text>
    <text x="52" y="74" font-size="13.5" fill="#c9d1d9">Full Stack:</text>
    <text x="316" y="74" text-anchor="end" font-size="14" font-weight="bold" fill="#fde047">Next.js</text>
  </g>
  <g class="row" style="animation-delay:0.72s">
    <text x="24" y="105" font-size="14">AI</text>
    <text x="52" y="105" font-size="13.5" fill="#c9d1d9">AI APIs:</text>
    <text x="316" y="105" text-anchor="end" font-size="14" font-weight="bold" fill="#7dd3fc">Gemini · Groq</text>
  </g>
  <g class="row" style="animation-delay:0.94s">
    <text x="24" y="136" font-size="14">DB</text>
    <text x="52" y="136" font-size="13.5" fill="#c9d1d9">Data:</text>
    <text x="316" y="136" text-anchor="end" font-size="14" font-weight="bold" fill="#4ade80">Firebase · MongoDB</text>
  </g>
  <g class="row" style="animation-delay:1.16s">
    <text x="24" y="167" font-size="14">VO</text>
    <text x="52" y="167" font-size="13.5" fill="#c9d1d9">Voice AI:</text>
    <text x="316" y="167" text-anchor="end" font-size="14" font-weight="bold" fill="#c084fc">Vapi</text>
  </g>
  <g class="row" style="animation-delay:1.38s">
    <text x="24" y="198" font-size="14">++</text>
    <text x="52" y="198" font-size="13.5" fill="#c9d1d9">Currently Building:</text>
    <text x="316" y="198" text-anchor="end" font-size="14" font-weight="bold" fill="#ff7eb6">PrepWise</text>
  </g>

<!-- Engineering focus ring -->
<g transform="translate(408,138)">
  <circle r="52" fill="none" stroke="#241740" stroke-width="9"/>
  <circle r="52" fill="none" stroke="url(#ringg)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="254.8 326.7" stroke-dashoffset="254.8" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="254.8" to="0" dur="1.6s" begin=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
  </circle>
  <text class="rk" y="14" text-anchor="middle" font-size="32" font-weight="bold" fill="#ff7eb6" filter="url(#g)">AI</text>
  <text y="76" text-anchor="middle" font-size="10.5" fill="#8b949e" opacity="0" style="animation:fadeIn .5s ease 1.8s forwards">FOCUS</text>
</g>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="232" fill="url(#shg)"/></g>
</svg>
